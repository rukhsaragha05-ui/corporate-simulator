<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Corporate Chaos Simulator - Leaderboard</title>
<script src="scores.js"></script>
<style>
body { font-family: Arial; text-align:center; background:#0f172a; color:white; }
h1 { margin-bottom:20px; }
table { margin:auto; font-size:20px; border-collapse: collapse; }
td,th { padding:10px 20px; border:1px solid white; }
.first { background:gold; color:black; }
.second { background:silver; color:black; }
.third { background:#cd7f32; color:black; }
button { padding: 10px 20px; margin: 20px 10px; font-size: 16px; cursor: pointer; border-radius: 5px; border: none; }
.btn-refresh { background-color: #2563eb; color: white; }
.btn-clear { background-color: #dc2626; color: white; }
</style>
</head>
<body>

<h1>🏆 Leaderboard</h1>
<table id="leaderboard">
<tr><th>Rank</th><th>Team Name</th><th>Score</th></tr>
</table>

<button class="btn-refresh" onclick="refresh()">Refresh Now 🔄</button>
<button class="btn-clear" onclick="clearAll()">Clear All 🗑️</button>

<script>
// Made this function async so it safely grabs the data from the cloud database
async function refresh(){
    let scores = [];
    
    // Check if our cloud fetch function is ready from scores.js
    if (typeof fetchScoresFromServer === "function") {
        scores = await fetchScoresFromServer();
    } else {
        scores = getScores(); 
    }

    let table = document.getElementById("leaderboard");
    table.innerHTML='<tr><th>Rank</th><th>Team Name</th><th>Score</th></tr>';
    
    scores.forEach((team,index)=>{
        let cls="";
        if(index===0) cls="first";
        else if(index===1) cls="second";
        else if(index===2) cls="third";
        table.innerHTML += `<tr class="${cls}"><td>${index+1}</td><td>${team.teamName}</td><td>${team.score}</td></tr>`;
    });
}

function clearAll(){
    if(confirm("Are you sure you want to reset the global leaderboard data?")) {
        clearScores(); // Clears both cloud database and local memory
        refresh();
    }
}

// Initial pull on load
refresh();

// Auto-refresh from cloud server every 5 seconds dynamically
setInterval(refresh, 5000);
</script>

</body>
</html>
